# Default audit policy for kind clusters, copy to resources/kind-audit-policy.yaml in your cluster repository to override
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
- RequestReceived
rules:
# Skip high volume, low value requests
- level: None
  users: ["system:kube-proxy"]
  verbs: ["watch"]
- level: None
  resources:
  - group: ""
    resources: ["events"]
  - group: "coordination.k8s.io"
    resources: ["leases"]
- level: None
  nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics"]
# Never log the contents of secrets, configmaps or tokens
- level: Metadata
  resources:
  - group: ""
    resources: ["secrets", "configmaps", "serviceaccounts/token"]
  - group: "authentication.k8s.io"
    resources: ["tokenreviews"]
# Log request bodies for changes, metadata for everything else
- level: Request
  verbs: ["create", "update", "patch", "delete", "deletecollection"]
- level: Metadata
