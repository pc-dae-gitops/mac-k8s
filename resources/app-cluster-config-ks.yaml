apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-cluster-config-${appName}
  namespace: ${nameSpace}
spec:
  interval: 10m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: ${dependsOn}
  path: ./local-cluster/apps/config/${appName}
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      nameSpace: ${nameSpace}
      appName: ${appName}
      # config values from apps.yaml
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: ${appName}-config
        optional: true
