apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mac-k8s-config
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    branch: ${global_config_branch}
  secretRef:
    name: flux-system
  url: https://${GITHUB_SERVER}/${GITHUB_GLOBAL_CONFIG_ORG}/${GITHUB_GLOBAL_CONFIG_REPO}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-components
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./local-cluster/gotk
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://${GitHubServer}/${GITHUB_MGMT_ORG}/${GITHUB_MGMT_REPO}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./${target_path}/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

