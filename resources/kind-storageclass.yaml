# Provides a hostpath storage class on kind clusters, matching the storage class name used by Docker Kubernetes
# so that workloads specifying storageClass: hostpath work on either cluster type.
# Uses the local-path-provisioner that kind installs by default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hostpath
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
