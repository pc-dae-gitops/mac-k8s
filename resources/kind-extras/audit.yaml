# Enables Kubernetes API server audit logging
#   KIND_AUDIT_POLICY audit policy file, default resources/kind-audit-policy.yaml
# Audit logs are written to ${KIND_DATA_DIR}/audit on the host and /var/log/kubernetes on the control-plane node,
# where they can be collected by a log collector, e.g. OpenTelemetry collector filelog receiver.
controlPlane:
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
        audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
        audit-log-maxsize: "100"
        audit-log-maxbackup: "5"
      extraVolumes:
      - name: audit-policies
        hostPath: /etc/kubernetes/policies
        mountPath: /etc/kubernetes/policies
        readOnly: true
        pathType: DirectoryOrCreate
      - name: audit-logs
        hostPath: /var/log/kubernetes
        mountPath: /var/log/kubernetes
        readOnly: false
        pathType: DirectoryOrCreate
  extraMounts:
  - hostPath: ${KIND_AUDIT_POLICY}
    containerPath: /etc/kubernetes/policies/audit-policy.yaml
    readOnly: true
  - hostPath: ${KIND_DATA_DIR}/audit
    containerPath: /var/log/kubernetes
