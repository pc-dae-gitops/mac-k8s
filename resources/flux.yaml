apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mac-k8s-config
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: ${global_config_branch}
  secretRef:
    name: flux-system
  url: https://${GITHUB_SERVER}/${GITHUB_GLOBAL_CONFIG_ORG}/${GITHUB_GLOBAL_CONFIG_REPO}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  # dnsSuffix, storageClass and the other cluster settings are in the cluster-config ConfigMap
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
