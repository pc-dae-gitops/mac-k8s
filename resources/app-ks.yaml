apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-${nameSpace}-${appName}
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: flux
  path: ./local-cluster/apps/${appName}
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      nameSpace: ${nameSpace}
      appName: ${appName}
      registryName: ${registryName}
      repoName: ${repoName}
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config