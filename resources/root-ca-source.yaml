apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: root-ca-repository
  namespace: flux-system
spec:
  interval: 1m0s
  # Replace with your repository URL
  url: https://github.com/your-org/your-repo.git
  ref:
    # Replace with your branch name
    branch: main
  # If your repository is private, uncomment the following lines
  # and replace with the name of your secret.
  # secretRef:
  #   name: your-git-credentials
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: root-ca-kustomization
  namespace: flux-system
spec:
  interval: 1m0s
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: root-ca-repository
  # Replace with the path to your kustomization or file
  path: "./"
