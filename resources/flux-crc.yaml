# Flux Kustomizations for OpenShift Local (crc) clusters, see bin/crc-setup.sh
# The OpenShift router provides ingress, the hostpath provisioner provides storage and cluster monitoring
# provides metrics-server and kube-state-metrics, so ingress-nginx, metrics-server and kube-state-metrics
# are not deployed. cert-manager and the secrets store csi driver are deployed using Red Hat operators
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crc-scc
  namespace: flux-system
spec:
  dependsOn:
  - name: flux-components
  interval: 1m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/core/crc/scc
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  dependsOn:
  - name: flux-components
  - name: crc-scc
  interval: 1m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/core/kyverno
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  patches:
    - target:
        kind: HelmRelease
        name: kyverno
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kyverno
        spec:
          values:
            # Do not block api requests if kyverno is unavailable, i.e. following crc stop/start
            features:
              forceFailurePolicyIgnore:
                enabled: true
            config:
              # Keep kyverno away from OpenShift control plane namespaces
              webhooks:
                namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: NotIn
                      values:
                        - kube-system
                    - key: openshift.io/run-level
                      operator: DoesNotExist
              resourceFiltersInclude:
                - "[*/*,openshift,*]"
                - "[*/*,openshift-*,*]"
            # bitnami/kubectl is no longer published, the hook jobs need bash and awk as well as kubectl
            webhooksCleanup:
              image:
                registry: registry.redhat.io
                repository: openshift4/ose-cli
                tag: latest
            policyReportsCleanup:
              image:
                registry: registry.redhat.io
                repository: openshift4/ose-cli
                tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
  - name: flux-components
  interval: 1m0s
  retryInterval: 30s
  timeout: 10m
  path: ./local-cluster/core/crc/cert-manager
  prune: true
  # healthChecks are ignored if wait is true, wait for the operator to deploy cert-manager
  wait: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  dependsOn:
  - name: flux-components
  - name: crc-scc
  interval: 1m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/core/reloader
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-config
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/cert-config
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      dnsSuffix: ${LOCAL_DNS}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-config
    - name: config
    - name: crc-scc
  interval: 1m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/core/vault
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  patches:
    - target:
        kind: HelmRelease
        name: vault
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: vault
        spec:
          values:
            # Let the restricted-v2 SCC assign the uid and fsGroup
            global:
              openshift: true
            # Fully qualified images, crc short name aliases map hashicorp/vault and hashicorp/vault-k8s
            # to registry.connect.redhat.com which does not publish the upstream tags
            injector:
              image:
                repository: docker.io/hashicorp/vault-k8s
              agentImage:
                repository: docker.io/hashicorp/vault
            server:
              image:
                repository: docker.io/hashicorp/vault
              # Not rendered when global.openshift is true, see vault-ingress
              ingress:
                enabled: false
            # Register with the Red Hat secrets store csi driver, see local-cluster/core/crc/csi
            csi:
              image:
                repository: docker.io/hashicorp/vault-csi-provider
              agent:
                image:
                  repository: docker.io/hashicorp/vault
              daemonSet:
                providersDir: /var/run/secrets-store-csi-providers
                securityContext:
                  container:
                    privileged: true
  postBuild:
    substitute:
      storageClass: crc-csi-hostpath-provisioner
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
