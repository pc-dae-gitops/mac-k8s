apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    version: "2.9.x"
    registry: "${CORP_MIRROR:-ghcr.io}/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: ${FLUX_CLUSTER_TYPE}
    size: small
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  storage:
    class: "${STORAGE_CLASS}"
    size: "10Gi"
  commonMetadata:
    labels:
      app.kubernetes.io/name: flux
  sync:
    kind: GitRepository
    url: "https://${GITHUB_SERVER:-github.com}/${GITHUB_MGMT_ORG}/${GITHUB_MGMT_REPO}.git"
    ref: "${GITHUB_MGMT_BRANCH:-main}"
    path: "local-cluster/flux"
    pullSecret: "flux-system"
  kustomize:
    patches:
      - target:
          kind: Deployment
        patch: |
          - op: replace
            path: /spec/template/spec/nodeSelector
            value:
              kubernetes.io/os: linux
          - op: add
            path: /spec/template/spec/tolerations
            value:
              - key: "CriticalAddonsOnly"
                operator: "Exists"
