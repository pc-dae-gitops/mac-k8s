apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespace-${nameSpace}
  namespace: ${nameSpace}
spec:
  interval: 10m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: flux
      namespace: flux-system
  path: ./local-cluster/templates/namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
    namespace: flux-system
  postBuild:
    substitute:
      nameSpace: ${nameSpace}
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config