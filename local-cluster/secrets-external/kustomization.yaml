---
# Used instead of local-cluster/secrets when EXTERNAL_VAULT is set (cluster-config vaultStoreSuffix: -external),
# adds the external Vault Enterprise namespace to the flux-system SecretStore
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../secrets
patches:
- target:
    kind: SecretStore
    name: vault
  patch: |
    - op: add
      path: /spec/provider/vault/namespace
      value: ${vaultNamespace}
