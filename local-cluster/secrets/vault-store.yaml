---
# Identity used by External Secrets to log in to Vault with Kubernetes auth, the flux-system role is created by
# vault-secrets-config.sh
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: flux-system
---
# Used by the flux-system ExternalSecrets, see local-cluster/bases/flux/secrets.yaml
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: flux-system
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      # CA that issued vault's server certificate, the local CA, or the OpenShift service CA on OpenShift, see setup.sh
      caProvider:
        type: ConfigMap
        name: ${vaultCaConfigMap:=local-ca}
        key: ${vaultCaKey:=CA.cer}
      path: secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: flux-system
          serviceAccountRef:
            name: vault-secrets
