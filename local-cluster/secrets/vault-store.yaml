---
# Identity used by External Secrets to log in to Vault with Kubernetes auth, the flux-system role is created by
# vault-secrets-config.sh
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: flux-system
---
# Used by the flux-system ExternalSecrets, see local-cluster/bases/flux/secrets.yaml
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: flux-system
spec:
  provider:
    vault:
      # The in-cluster vault unless EXTERNAL_VAULT is set, local-cluster/secrets-external adds the Vault Enterprise
      # namespace, the defaults keep clusters whose cluster-config predates these settings working
      server: ${vaultServer:=https://vault.vault.svc:8200}
      # CA that issued vault's server certificate, the local CA, or the OpenShift service CA on OpenShift, see setup.sh
      caProvider:
        type: ConfigMap
        name: ${vaultCaConfigMap:=local-ca}
        key: ${vaultCaKey:=CA.cer}
      path: ${vaultKvMount:=secrets}
      version: v2
      auth:
        kubernetes:
          mountPath: ${vaultAuthMount:=kubernetes}
          role: flux-system
          serviceAccountRef:
            name: vault-secrets
