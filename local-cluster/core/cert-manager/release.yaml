apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      version: v1.19.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 10m0s
  timeout: 5m
  values:
    installCRDs: true
    controller:
      securityContext:
        enabled: true
        fsGroup: 1001
        runAsUser: 1001
    webhook:
      hostNetwork: false
      securityContext:
        enabled: true
        fsGroup: 1001
        runAsUser: 1001
    cainjector:
      securityContext:
        enabled: true
        fsGroup: 1001
        runAsUser: 1001

