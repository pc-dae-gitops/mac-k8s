apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  # Kyverno does not access the internet, no image verification or image data policies are used, so the proxy and
  # custom-ca are not needed
  values:
    global:
      {{- if .Values.mirrorRegistry }}
      # Replaces the controllers' and crd migration hook's default registry, reg.kyverno.io
      image:
        registry: {{ .Values.mirrorRegistry }}
      {{- end }}
      imagePullSecrets: {{- include "addon.imagePullSecrets" . | nindent 8 }}
    {{- if .Values.mirrorRegistry }}
    # The webhook cleanup hooks and tests use ghcr.io/kyverno/readiness-checker, the registry is set explicitly so
    # global.image.registry does not apply to them
    webhooksCleanup:
      image:
        registry: {{ .Values.mirrorRegistry }}
    test:
      image:
        registry: {{ .Values.mirrorRegistry }}
    {{- end }}
    {{- if include "addon.isOpenShift" . }}
    # Do not block api requests if kyverno is unavailable, i.e. following crc stop/start
    features:
      forceFailurePolicyIgnore:
        enabled: true
    config:
      # Keep kyverno away from OpenShift control plane namespaces
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
            - key: openshift.io/run-level
              operator: DoesNotExist
      resourceFiltersInclude:
        - "[*/*,openshift,*]"
        - "[*/*,openshift-*,*]"
    {{- end }}
