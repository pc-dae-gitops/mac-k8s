{{- /* Fully qualified image, crc short name aliases map hashicorp/vault to
registry.connect.redhat.com which does not publish the upstream tags */}}
{{- $registry := include "addon.registry" (list . "docker.io") -}}
{{- $storageClass := .Values.storageClass | default (ternary "crc-csi-hostpath-provisioner" "hostpath" (eq (include "addon.isOpenShift" .) "true")) -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  chart:
    spec:
      chart: vault
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  {{- if include "addon.isOpenShift" . }}
  # The OpenShift service CA issues the vault-server-tls certificate for vault.vault.svc, routers and pods trust it.
  # Patched as the chart gives the vault and vault-internal Services the same annotations, the service CA
  # only creates the secret for one Service
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: vault
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: vault
                annotations:
                  service.beta.openshift.io/serving-cert-secret-name: vault-server-tls
  {{- end }}
  values:
    global:
      enabled: true
      # Vault serves https, the chart's probes and the pod's VAULT_ADDR use https
      tlsDisable: false
      {{- if include "addon.isOpenShift" . }}
      # Let the restricted-v2 SCC assign the uid and fsGroup
      openshift: true
      {{- end }}
      imagePullSecrets: {{- include "addon.imagePullSecrets" . | nindent 8 }}
    csi:
      enabled: false
    injector:
      enabled: false
    server:
      enabled: true
      image:
        repository: {{ $registry }}/hashicorp/vault
      dataStorage:
        storageClass: {{ $storageClass }}
      serviceAccount:
        name: vault
      # The vault CLI in the pod, i.e. vault-unseal.sh, connects to https://127.0.0.1:8200, which is not in the certificate
      extraEnvironmentVars:
        VAULT_TLS_SERVER_NAME: vault.vault.svc
        {{- if include "addon.isOpenShift" . }}
        VAULT_CACERT: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        {{- else }}
        VAULT_CACERT: /vault/userconfig/vault-server-tls/ca.crt
        {{- end }}
      standalone:
        config: |
          ui = true
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/userconfig/vault-server-tls/tls.crt"
            tls_key_file = "/vault/userconfig/vault-server-tls/tls.key"
          }
          storage "file" {
            path = "/vault/data"
          }
      {{- if .Values.clusterIP }}
      hostAliases:
        - ip: {{ .Values.clusterIP }}
          hostnames:
            - vault.{{ .Values.dnsSuffix }}
      {{- end }}
      # Vault's server certificate, see templates/certificate.yaml, or issued by the OpenShift service CA, see postRenderers
      volumes:
        - name: vault-server-tls
          secret:
            secretName: vault-server-tls
        {{- if include "addon.isLocalCluster" . }}
        # Trust the local CA, which issues the vault.{{ .Values.dnsSuffix }} certificate, setup.sh creates the local-ca ConfigMap (local clusters only: crc, k8s)
        - name: local-ca
          configMap:
            name: local-ca
        {{- end }}
      volumeMounts:
        - name: vault-server-tls
          mountPath: /vault/userconfig/vault-server-tls
          readOnly: true
        {{- if include "addon.isLocalCluster" . }}
        - name: local-ca
          mountPath: /etc/ssl/certs/local-ca.pem
          subPath: CA.cer
          readOnly: true
        {{- end }}
      ingress:
        {{- if include "addon.isOpenShift" . }}
        # Not rendered when global.openshift is true, see core/charts/crc/vault-ingress
        enabled: false
        {{- else }}
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: local-ca-issuer
          # Re-encrypt to vault, verifying its certificate with the ca.crt in vault-server-tls
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
          nginx.ingress.kubernetes.io/proxy-ssl-secret: vault/vault-server-tls
          nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-name: vault.vault.svc
          nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
        tls:
          - secretName: vault-tls
            hosts:
              - vault.{{ .Values.dnsSuffix }}
        hosts:
          - host: vault.{{ .Values.dnsSuffix }}
        {{- end }}
