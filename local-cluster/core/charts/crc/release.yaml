apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/core/crc/logging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
