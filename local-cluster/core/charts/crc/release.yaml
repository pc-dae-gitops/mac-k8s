apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crc-scc
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 5m
  targetNamespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./local-cluster/core/charts/crc/scc
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  dependsOn:
    - name: crc-scc
  interval: 5m0s
  timeout: 5m
  targetNamespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./local-cluster/core/charts/common/kyverno
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
  # Cluster settings from the cluster-config ConfigMap, substituted by the core Kustomizations, see lib/addon-lib
  values:
    clusterType: ${clusterType}
    dnsSuffix: "${dnsSuffix}"
    clusterIP: "${clusterIP:=}"
    storageClass: "${storageClass:=}"
    mirrorRegistry: "${mirrorRegistry:=}"
    imagePullSecretName: "${imagePullSecretName:=}"
    proxy: "${proxy:=false}"
    certs: "${certs:=false}"
    kindCluster: "${kindCluster:=false}"
    kubeletInsecureTLS: "${kubeletInsecureTLS:=false}"
---
