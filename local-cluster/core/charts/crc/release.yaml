apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crc-scc
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 5m
  targetNamespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./core/charts/crc/scc
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  dependsOn:
    - name: crc-scc
  interval: 5m0s
  timeout: 5m
  targetNamespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./core/charts/common/kyverno
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: cluster-config
  values:
    global:
      corpRegistry: ${mirrorRegistry:=}
      proxy: ${proxy:=false}
      certs: ${certs:=false}
---
