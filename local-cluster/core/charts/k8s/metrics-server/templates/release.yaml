{{- $registry := include "addon.registry" (list . "registry.k8s.io") -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  values:
    image:
      repository: {{ $registry }}/metrics-server/metrics-server
    addonResizer:
      image:
        repository: {{ $registry }}/autoscaling/addon-resizer
    imagePullSecrets: {{- include "addon.imagePullSecrets" . | nindent 6 }}
    {{- if eq (toString .Values.kubeletInsecureTLS) "true" }}
    # Kubelet serving certificates are self signed rather than signed by the cluster CA, i.e. Docker Kubernetes or
    # kind clusters without the metrics extra
    args:
      - --kubelet-insecure-tls
    {{- end }}
