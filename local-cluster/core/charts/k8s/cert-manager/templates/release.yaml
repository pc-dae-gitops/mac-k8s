apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      version: v1.19.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  values:
    installCRDs: true
    securityContext:
      runAsNonRoot: false
    {{- if not (empty (default "" .Values.mirrorRegistry)) }} 
    image:
      registry: ${mirrorRegistry}
    webhook:
      hostNetwork: false
      image:
        registry: ${mirrorRegistry}
    cainjector:
      image:
        registry: ${mirrorRegistry}
    startupapicheck:
      image:
        registry: ${mirrorRegistry}
    {{- end }}

