{{- $registry := include "addon.registry" (list . "quay.io") -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      version: v1.19.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  values:
    installCRDs: true
    global:
      imagePullSecrets: {{- include "addon.imagePullSecrets" . | nindent 8 }}
    securityContext:
      runAsNonRoot: false
    image:
      repository: {{ $registry }}/jetstack/cert-manager-controller
    # The controller accesses ACME servers and external issuers
    extraEnv: {{- include "addon.proxyEnv" . | nindent 6 }}
    volumes: {{- include "addon.caVolumes" . | nindent 6 }}
    volumeMounts: {{- include "addon.caVolumeMounts" . | nindent 6 }}
    webhook:
      hostNetwork: false
      image:
        repository: {{ $registry }}/jetstack/cert-manager-webhook
    cainjector:
      image:
        repository: {{ $registry }}/jetstack/cert-manager-cainjector
    acmesolver:
      image:
        repository: {{ $registry }}/jetstack/cert-manager-acmesolver
    startupapicheck:
      image:
        repository: {{ $registry }}/jetstack/cert-manager-startupapicheck
