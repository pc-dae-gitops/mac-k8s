{{- $registry := include "addon.registry" (list . "registry.k8s.io") -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-secrets-store
  namespace: kube-system
spec:
  chart:
    spec:
      chart: secrets-store-csi-driver
      version: "1.5.3"
      sourceRef:
        kind: HelmRepository
        name: secrets-store-csi-driver
        namespace: kube-system
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  values:
    linux:
      image:
        repository: {{ $registry }}/csi-secrets-store/driver
      crds:
        image:
          repository: {{ $registry }}/csi-secrets-store/driver-crds
      registrarImage:
        repository: {{ $registry }}/sig-storage/csi-node-driver-registrar
      livenessProbeImage:
        repository: {{ $registry }}/sig-storage/livenessprobe
    imagePullSecrets: {{- include "addon.imagePullSecrets" . | nindent 6 }}
