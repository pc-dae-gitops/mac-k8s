apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.6.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 5m0s
  timeout: 5m
  values:
    global:
      {{- if .Values.mirrorRegistry }}
      imageRegistry: {{ .Values.mirrorRegistry }}
      {{- end }}
      imagePullSecrets: {{- include "addon.imagePullSecrets" . | nindent 8 }}
