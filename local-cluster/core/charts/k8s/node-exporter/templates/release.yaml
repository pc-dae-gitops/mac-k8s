# Node metrics for the otel-node collector's VictoriaMetrics pipeline and the Grafana node dashboards.
# Uses host networking, otel-node scrapes it on each node's IP, port 9100.
# The prometheus-community HelmRepository is defined in kube-state-metrics.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: kube-system
spec:
  chart:
    spec:
      chart: prometheus-node-exporter
      version: 4.59.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  interval: 5m0s
  timeout: 5m
  values:
    hostNetwork: true
    {{- if not (empty (default "" .Values.mirrorRegistry)) }}
    image:
      registry: ${mirrorRegistry}
    {{- end }}
