apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  chart:
    spec:
      chart: ingress-nginx
      version: 4.12.0
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
  rollback:
    cleanupOnFail: false
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
    crds: CreateReplace
  interval: 10m0s
  timeout: 5m
  # Cluster type specific values, e.g. kind clusters, created by setup.sh
  valuesFrom:
    - kind: ConfigMap
      name: ingress-nginx-values
      valuesKey: values.yaml
      optional: true
  values:
    controller:
      service:
        annotations:
          # service.beta.kubernetes.io/aws-load-balancer-type: external
          # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          # service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          external-dns.alpha.kubernetes.io/hostname: ${dnsSuffix}
      ingressClassResource:
        default: "true"
      watchIngressWithoutClass: "true"
