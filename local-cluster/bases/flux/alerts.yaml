apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-status
  namespace: flux-system
spec:
  type: github
  address: https://${GitHubServer}/${GitHubOrg}/${GitHubRepo}
  secretRef:
    name: github-repo-write-token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status
  namespace: flux-system
spec:
  providerRef:
    name: github-status
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
      matchLabels:
            alert: "commit-status"
  exclusionList:
    - "^Dependencies do not meet ready condition, retrying in.*"