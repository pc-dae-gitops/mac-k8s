# Splunk admin password and HEC token, from the splunk app's splunk-secrets secret in resource-descriptions/apps.yaml.
# The HEC token must be the same as the otel app's splunk-hec-token, set both from SPLUNK_HEC_TOKEN.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: splunk-secrets
  namespace: ${nameSpace}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: splunk-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/${appName}/splunk-secrets
