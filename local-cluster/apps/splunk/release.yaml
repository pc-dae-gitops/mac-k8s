# Standalone Splunk Enterprise, a logs target for the otel gateway, see splunk/README.md in the observability repository
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: splunk
  namespace: ${nameSpace}
spec:
  interval: 5m0s
  timeout: 20m # Splunk takes several minutes to start, more under amd64 emulation on Apple Silicon
  targetNamespace: ${nameSpace}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./splunk/splunk-enterprise
      sourceRef:
        kind: GitRepository
        name: observability
        namespace: ${nameSpace}
  valuesFrom:
    - kind: ConfigMap
      name: splunk-values
      valuesKey: values.yaml
      optional: true
  values:
    splunkNamespace: ${nameSpace}
    clusterName: ${clusterName}
    clusterType: ${splunkClusterType:=kind} # kind or eks, the chart doesn't take the cluster-config clusterType
    acceptLicense: true
    # The hostpath volumes are on a Docker Desktop host mount, which Splunk doesn't recognise without this
    optimisticFileLocking: ${splunkOptimisticFileLocking:=true}
    image: # On Apple Silicon set splunkImageRepository to localhost:5001/splunk, pushed by the splunk kind extra
      repository: ${splunkImageRepository:=splunk/splunk}
      pullPolicy: ${splunkImagePullPolicy:=IfNotPresent}
    ingress:
      enabled: true
      className: ${splunkIngressClassName:=nginx}
      annotations:
        cert-manager.io/cluster-issuer: local-ca-issuer
      web:
        host: splunk.${dnsSuffix}
      hec:
        host: splunk-hec.${dnsSuffix}
