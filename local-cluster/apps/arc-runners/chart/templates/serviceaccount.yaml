{{- $imagePullSecretName := include "arc-runners.imagePullSecretName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-sa
  namespace: {{ include "arc-runners.namespace" . }}
{{- if $imagePullSecretName }}
imagePullSecrets:
  - name: {{ $imagePullSecretName | quote }}
{{- end }}
