# Loki log store for the otel gateway, see loki/README.md in the observability repository
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: ${nameSpace}
spec:
  interval: 5m0s
  timeout: 10m
  targetNamespace: ${nameSpace}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./loki/loki
      sourceRef:
        kind: GitRepository
        name: observability
        namespace: ${nameSpace}
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
      optional: true
  values:
    loki:
      ingress:
        enabled: true # Loki has no UI, / redirects to /services which lists the state of the Loki components
        ingressClassName: ${lokiIngressClassName:=nginx} # Set lokiIngressClassName to openshift-default on crc
        annotations:
          cert-manager.io/cluster-issuer: local-ca-issuer
          nginx.ingress.kubernetes.io/app-root: /services
        paths:
          queryFrontend:
            - / # All components run in the single binary, route every path to it, e.g. /ready, /config and /metrics
        hosts:
          - loki.${dnsSuffix}
        tls:
          - secretName: loki-tls
            hosts:
              - loki.${dnsSuffix}
