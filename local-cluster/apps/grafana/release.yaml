# Grafana with VictoriaMetrics and Loki datasources and Kubernetes dashboards, see grafana/README.md in the observability repository
# The admin password is generated by the chart:
#   kubectl -n ${nameSpace} get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: ${nameSpace}
spec:
  interval: 5m0s
  timeout: 5m
  targetNamespace: ${nameSpace}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./grafana/grafana
      sourceRef:
        kind: GitRepository
        name: observability
        namespace: ${nameSpace}
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
      valuesKey: values.yaml
      optional: true
  values:
    grafana:
      ingress:
        enabled: true
        ingressClassName: ${grafanaIngressClassName:=nginx} # Set grafanaIngressClassName to openshift-default on crc
        annotations:
          cert-manager.io/cluster-issuer: local-ca-issuer
        hosts:
          - grafana.${dnsSuffix}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${dnsSuffix}
