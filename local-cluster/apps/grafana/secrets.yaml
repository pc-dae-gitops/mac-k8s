# Grafana admin user and password, from the grafana app's admin secret in resource-descriptions/apps.yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: ${nameSpace}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: grafana-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/${appName}/admin
