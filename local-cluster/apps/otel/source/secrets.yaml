apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: observability-git-token
  namespace: ${nameSpace}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: observability-git-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/otel/observability-git-token

