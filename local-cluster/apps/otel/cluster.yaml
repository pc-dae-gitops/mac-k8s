apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-cluster
  namespace: ${nameSpace}
spec:
  interval: 1m
  targetNamespace: ${nameSpace}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./otel/cluster/otel-cluster
      sourceRef:
        kind: GitRepository
        name: observability
        namespace: ${nameSpace}
  valuesFrom:
    - kind: ConfigMap
      name: otel-cluster-values
      valuesKey: values.yaml
      optional: true
  values:
    otelNamespace: ${nameSpace}
    clusterType: ${clusterType}
    clusterName: ${clusterName}
