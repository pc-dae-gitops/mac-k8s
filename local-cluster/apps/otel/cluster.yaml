apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-cluster
  namespace: ${nameSpace}
spec:
  interval: 5m
  targetNamespace: ${nameSpace}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: ./otel/cluster/otel-cluster
      sourceRef:
        kind: GitRepository
        name: observability
        namespace: ${nameSpace}
  valuesFrom:
    - kind: ConfigMap
      name: otel-cluster-values
      valuesKey: values.yaml
      optional: true
  values:
    otelNamespace: ${nameSpace}
    clusterType: ${clusterType}
    clusterName: ${clusterName}${suffix:=}
    hostSuffix: ${suffix:=}
    targets: # Set otelNewRelic, otelSplunk, otelVictoriaMetrics and otelLoki in the otel app config in resource-descriptions/apps.yaml
      newrelic:
        enabled: ${otelNewRelic:=true}
      splunk:
        enabled: ${otelSplunk:=true}
      victoriametrics:
        enabled: ${otelVictoriaMetrics:=false}
      loki:
        enabled: ${otelLoki:=false}
    platforms:
      kubernetes: # Needs the kind-extras metrics extra, set otelControlPlaneComponents in the otel app config
        controlPlaneComponents: ${otelControlPlaneComponents:=false}
