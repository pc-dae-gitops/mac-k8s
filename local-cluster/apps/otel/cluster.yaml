apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-cluster
  namespace: ${nameSpace}
spec:
  interval: 1m
  targetNamespace: ${nameSpace}
# Configuration for fresh installations
  install:
    remediation:
      retries: -1          # -1 means unlimited retries (or set to desired integer)

  # Configuration for upgrades
  upgrade:
    remediation:
      retries: -1          # -1 means unlimited retries
      remediateLastFailure: true # Forces remediation on the latest failed state

  chart:
    spec:
      chart: ./otel/cluster/otel-cluster
      sourceRef:
        kind: GitRepository
        name: observability
        namespace: ${nameSpace}
  valuesFrom:
    - kind: ConfigMap
      name: otel-cluster-values
      valuesKey: values.yaml
      optional: true
  values:
    otelNamespace: ${nameSpace}
    clusterType: ${clusterType}
    clusterName: ${clusterName}
