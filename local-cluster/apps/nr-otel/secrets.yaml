# The otel app's New Relic license key, so the data goes to the same account as the otel gateway's
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: newrelic-key
  namespace: ${nameSpace}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: newrelic-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/otel/newrelic-key
