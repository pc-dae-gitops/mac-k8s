apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-${clusterType}
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 30s
  path: ./core/charts/${clusterType}
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      # storageClass: crc-csi-hostpath-provisioner
      storageClass: hostpath
      dnsSuffix: ${LOCAL_DNS}
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
  patches:
    - target:
        kind: HelmRelease
        name: vault
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: vault
        spec:
          values:
            # Let the restricted-v2 SCC assign the uid and fsGroup
            global:
              openshift: true
            # Fully qualified images, crc short name aliases map hashicorp/vault and hashicorp/vault-k8s
            # to registry.connect.redhat.com which does not publish the upstream tags
            injector:
              image:
                repository: docker.io/hashicorp/vault-k8s
              agentImage:
                repository: docker.io/hashicorp/vault
            server:
              image:
                repository: docker.io/hashicorp/vault
              # Not rendered when global.openshift is true, see vault-ingress
              ingress:
                enabled: false
            # Register with the Red Hat secrets store csi driver, see local-cluster/core/crc/csi
            csi:
              image:
                repository: docker.io/hashicorp/vault-csi-provider
              agent:
                image:
                  repository: docker.io/hashicorp/vault
              daemonSet:
                providersDir: /var/run/secrets-store-csi-providers
                securityContext:
                  container:
                    privileged: true
    - target:
        kind: HelmRelease
        name: kyverno
      # Replace this with Helm values setting
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kyverno
        spec:
          values:
            # Do not block api requests if kyverno is unavailable, i.e. following crc stop/start
            features:
              forceFailurePolicyIgnore:
                enabled: true
            config:
              # Keep kyverno away from OpenShift control plane namespaces
              webhooks:
                namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: NotIn
                      values:
                        - kube-system
                    - key: openshift.io/run-level
                      operator: DoesNotExist
              resourceFiltersInclude:
                - "[*/*,openshift,*]"
                - "[*/*,openshift-*,*]"
            # bitnami/kubectl is no longer published, the hook jobs need bash and awk as well as kubectl
            webhooksCleanup:
              image:
                registry: registry.redhat.io
                repository: openshift4/ose-cli
                tag: latest
            policyReportsCleanup:
              image:
                registry: registry.redhat.io
                repository: openshift4/ose-cli
                tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-common
  namespace: flux-system
spec:
  dependsOn:
    - name: core-${clusterType}
  interval: 5m0s
  timeout: 30s
  path: ./core/charts/common
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      storageClass: hostpath
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/secrets
  prune: true
  wait: true
  dependsOn:
    - name: core-common
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: secrets
  path: ./local-cluster/bases/flux
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: secrets
  path: ./local-cluster/namespaces
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: namespaces
  path: ./local-cluster/apps/ks
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config

