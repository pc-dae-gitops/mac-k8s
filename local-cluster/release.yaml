apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-${clusterType}
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 30s
  path: ./local-cluster/core/charts/${clusterType}
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  # The cluster type specific settings are handled by the charts, based on the cluster-config ConfigMap's settings
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-common
  namespace: flux-system
spec:
  dependsOn:
    - name: core-${clusterType}
  interval: 5m0s
  timeout: 30s
  path: ./local-cluster/core/charts/common
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster/secrets
  prune: true
  wait: true
  dependsOn:
    - name: core-common
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: secrets
  path: ./local-cluster/bases/flux
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-inputs
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: secrets
  path: ./local-cluster/apps/inputs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 5m
  dependsOn:
    - name: apps-inputs
  path: ./local-cluster/resourcesets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
