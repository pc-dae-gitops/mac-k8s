# AWS credentials used by the eks Terraform object's runner pods, written to Vault at secrets/aws-credentials by
# bin/aws-creds.sh, which forces a refresh when it replaces expired credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: flux-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: aws-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: aws-credentials
