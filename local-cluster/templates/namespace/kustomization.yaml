---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: arbitrary
resources:
- alerts.yaml
- cluster-config.yaml
- git-source.yaml
- ns.yaml
- vault.yaml
configMapGenerator:
- name: local-ca
  namespace: ${nameSpace}
  files:
  - ../../resources/CA.cer
  options:
    disableNameSuffixHash: true
