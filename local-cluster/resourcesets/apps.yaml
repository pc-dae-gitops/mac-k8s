# Generates the Flux objects for each app listed in the apps ResourceSetInputProvider,
# which is in the configuration repository at local-cluster/apps/inputs/apps.yaml.
# Per app:
# - the Namespace, the ${vaultCaConfigMap} and cluster-config ConfigMaps, copied from flux-system, and the <app>-config ConfigMap
#   with the app's config, used by the app's Kustomizations' postBuild substitutions
# - an ExternalSecret for each of the app's secrets and its sourceSecret, deploy-apps.sh writes them to Vault at
#   apps/<app>/<secret name>; a secret whose value is the marker { external: true } is external-only, its
#   ExternalSecret extracts the secret name as the Vault path verbatim, is named after the path's lowercased basename
#   and is not written to Vault (matches deploy-apps.sh's .value.external filter). A null value cannot be used, the
#   ResourceSetInputProvider drops null-valued keys from its exported inputs
# - a chain of Flux Kustomizations:
#   namespace-<namespace> -> app-source-<app> -> app-config-<app> (if clusterConfig) -> app-<app> and release-<release>
#   app-source-<app>: the GitRepository the app is deployed from, see local-cluster/templates/app-source
#   app-config-<app>:  local-cluster/apps/config/<app> in the configuration repository, i.e. <release>-values ConfigMaps
#   app-<app>:         the manifests at sourcePath in the source repository, if sourcePath is set or the app has no
#                      releases, sourcePath defaults to apps/<app>
#   release-<release>: a HelmRelease for each of the app's releases, see local-cluster/templates/helm-release
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: apps
  resourcesTemplate: |
    <<- range $a := inputs.apps >>
    <<- $ns := $a.namespace >>
    <<- $app := $a.name >>
    <<- $source := get $a "source" | default dict >>
    <<- $config := get $a "config" | default dict >>
    <<- $secrets := get $a "secrets" | default dict >>
    <<- $releases := get $a "releases" | default list >>
    <<- $sourceSecret := get $source "sourceSecret" >>
    <<- $sourcePath := get $source "sourcePath" | default (ternary "" (printf "apps/%s" $app) (gt (len $releases) 0)) >>
    <<- $configDep := ternary (printf "app-config-%s" $app) (printf "app-source-%s" $app) (eq (toString (get $a "clusterConfig")) "true") >>
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: << $ns >>
      annotations:
        # Removing an app from the list must not delete its namespace and data
        fluxcd.controlplane.io/prune: disabled
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${vaultCaConfigMap}
      namespace: << $ns >>
      annotations:
        fluxcd.controlplane.io/copyFrom: flux-system/${vaultCaConfigMap}
    ---
    # Used by the app's Kustomizations' postBuild substitutions, copied as is, Flux substitution would turn the
    # "true" and "false" values into booleans, which ConfigMap data does not accept
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-config
      namespace: << $ns >>
      annotations:
        fluxcd.controlplane.io/copyFrom: flux-system/cluster-config
    ---
    # The app's config, used by the app's Kustomizations' postBuild substitutions
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: << $app >>-config
      namespace: << $ns >>
    data:
      nameSpace: << $ns | quote >>
      appName: << $app | quote >>
      <<- range $k, $v := $config >>
      << $k >>: << $v | toString | quote >>
      <<- end >>
    <<- $secretNames := keys $secrets >>
    <<- if and $sourceSecret (not (has $sourceSecret $secretNames)) >>
    <<- $secretNames = append $secretNames $sourceSecret >>
    <<- end >>
    <<- range $s := $secretNames >>
    <<- $secretVal := get $secrets $s >>
    <<- $external := and (kindIs "map" $secretVal) (eq (toString (dig "external" false $secretVal)) "true") >>
    ---
    apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      <<- if $external >>
      name: << base $s | lower >>
      <<- else >>
      name: << $s >>
      <<- end >>
      namespace: << $ns >>
    spec:
      refreshInterval: 5m
      secretStoreRef:
        kind: SecretStore
        name: vault
      target:
        <<- if $external >>
        name: << base $s | lower >>
        <<- else >>
        name: << $s >>
        <<- end >>
        creationPolicy: Owner
      dataFrom:
        - extract:
            <<- if $external >>
            key: << $s >>
            <<- else >>
            key: ${vaultSecretsPrefix:=}apps/<< $app >>/<< $s >>
            <<- end >>
    <<- end >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: namespace-<< $ns >>
      namespace: flux-system
    spec:
      interval: 5m0s
      retryInterval: 30s
      timeout: 30s
      # namespace-external when EXTERNAL_VAULT is set, it adds the Vault Enterprise namespace to the SecretStore
      path: ./local-cluster/templates/namespace${vaultStoreSuffix:=}
      prune: true
      wait: true
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
      postBuild:
        substitute:
          nameSpace: << $ns >>
        substituteFrom:
          - kind: ConfigMap
            name: cluster-config
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: app-source-<< $app >>
      namespace: << $ns >>
    spec:
      interval: 5m0s
      retryInterval: 30s
      timeout: 2m
      dependsOn:
        - name: namespace-<< $ns >>
          namespace: flux-system
      path: ./local-cluster/templates/app-source
      prune: true
      wait: true
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
      <<- if $sourceSecret >>
      patches:
        - target:
            kind: GitRepository
          patch: |
            - op: add
              path: /spec/secretRef
              value:
                name: << $sourceSecret >>
      <<- end >>
      postBuild:
        substitute:
          <<- range $k, $v := $source >>
          <<- if and (ne $k "sourcePath") (ne $k "sourceSecret") >>
          << $k >>: << $v | toString | quote >>
          <<- end >>
          <<- end >>
          nameSpace: << $ns >>
          appName: << $app >>
        substituteFrom:
          - kind: ConfigMap
            name: cluster-config
    <<- if eq (toString (get $a "clusterConfig")) "true" >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: app-config-<< $app >>
      namespace: << $ns >>
    spec:
      interval: 5m0s
      retryInterval: 30s
      timeout: 30s
      dependsOn:
        - name: app-source-<< $app >>
          namespace: << $ns >>
      path: ${targetPath:=./local-cluster}/apps/config/<< $app >>
      prune: true
      wait: true
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      postBuild:
        substituteFrom:
          - kind: ConfigMap
            name: cluster-config
          - kind: ConfigMap
            name: << $app >>-config
    <<- end >>
    <<- if $sourcePath >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: app-<< $app >>
      namespace: << $ns >>
    spec:
      interval: 5m0s
      retryInterval: 30s
      timeout: 5m
      dependsOn:
        - name: << $configDep >>
          namespace: << $ns >>
      path: ./<< $sourcePath | trimPrefix "./" >>
      prune: true
      wait: true
      sourceRef:
        kind: GitRepository
        name: << $app >>
        namespace: << $ns >>
      postBuild:
        substituteFrom:
          - kind: ConfigMap
            name: cluster-config
          - kind: ConfigMap
            name: << $app >>-config
    <<- end >>
    <<- range $r := $releases >>
    <<- $chartSource := get $r "chartSource" | default dict >>
    <<- $chartSourceType := get $chartSource "type" | default "oci" >>
    <<- $chartSourceName := get $chartSource "name" | default (printf "%s-%s-chart" $app $r.name) >>
    <<- $chartSourceUrl := "" >>
    <<- $chartVersion := "" >>
    <<- if $chartSource >>
    <<- if not (has $chartSourceType (list "oci" "helm")) >><<- fail (printf "release %s chartSource.type must be oci or helm" $r.name) >><<- end >>
    <<- if not (get $chartSource "url") >><<- fail (printf "release %s chartSource.url is required" $r.name) >><<- end >>
    <<- if not (get $chartSource "version") >><<- fail (printf "release %s chartSource.version is required" $r.name) >><<- end >>
    <<- $chartSourceUrl = get $chartSource "url" >>
    <<- $chartVersion = get $chartSource "version" >>
    <<- if eq $chartSourceType "oci" >><<- $chartSourceUrl = printf "%s/%s" (trimSuffix "/" $chartSourceUrl) (trimPrefix "./" $r.chart) >><<- end >>
    <<- end >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: release-<< $r.name >>
      namespace: << $ns >>
    spec:
      interval: 5m0s
      retryInterval: 30s
      timeout: << get $r "timeout" | default "5m" >>
      dependsOn:
        - name: << $configDep >>
          namespace: << $ns >>
      <<- if $chartSource >>
      path: ./local-cluster/templates/helm-release-<< $chartSourceType >>
      <<- else >>
      path: ./local-cluster/templates/helm-release
      <<- end >>
      prune: true
      wait: true
      sourceRef:
        kind: GitRepository
        name: mac-k8s-config
        namespace: flux-system
      patches:
        - target:
            kind: HelmRelease
          patch: |
            <<- if not (and $chartSource (eq $chartSourceType "oci")) >>
            <<- with get $r "valuesFiles" >>
            - op: add
              path: /spec/chart/spec/valuesFiles
              value: << toJson . >>
            <<- end >>
            <<- end >>
            - op: add
              path: /spec/values
              value: << get $r "values" | default dict | toJson >>
      postBuild:
        substitute:
          releaseName: << $r.name >>
          chart: << $r.chart | quote >>
          releaseTimeout: << get $r "timeout" | default "5m" >>
          <<- if $chartSource >>
          chartSourceName: << $chartSourceName >>
          chartSourceUrl: << $chartSourceUrl | quote >>
          chartVersion: << $chartVersion | quote >>
          chartSourceInterval: << get $chartSource "interval" | default "5m0s" | quote >>
          <<- end >>
        substituteFrom:
          - kind: ConfigMap
            name: cluster-config
          - kind: ConfigMap
            name: << $app >>-config
    <<- end >>
    <<- end >>
